apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-shop
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/viivek-git/myargocd-demo.git
    targetRevision: main
    path: declarative-approach/online-shop

  destination:
    server: https://kubernetes.default.svc
    namespace: online-shop

  syncPolicy:
    automated:
      prune: true      # Delete resources removed from Git
      selfHeal: true     # Fix drift if resources are changed manually